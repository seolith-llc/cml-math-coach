# Tests, builds and deploys the PWA to Cloudflare Pages.
#   push to main   -> production (https://cml-math-coach.seolith.com once the custom domain is added)
#   pull request   -> preview URL (https://<branch>.cml-math-coach.pages.dev), shown in the job summary
#
# One-time setup (repo Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN   API token with "Account > Cloudflare Pages > Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id (dashboard sidebar or URL)
# Without the secrets the workflow still tests and builds, and skips the deploy with a warning.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: cml-math-coach

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy (tests and build passed)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pages project if missing
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || echo "Project already exists - continuing."

      - name: Set up parent-dashboard database (D1)
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-d1.mjs

      - name: Configure weekly email (Amazon SES) secrets
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'CML Math Coach <coach@seolith.com>' }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY not set - weekly emails stay off."
            exit 0
          fi
          put() {
            [ -n "$2" ] || return 0
            printf '%s' "$2" | npx --yes wrangler@4 pages secret put "$1" --project-name "$PROJECT_NAME" > /dev/null
            echo "✔ set $1"
          }
          put AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
          put AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
          put AWS_REGION "$AWS_REGION"
          put MAIL_FROM "$MAIL_FROM"
          put MAIL_REPLY_TO "$MAIL_REPLY_TO"
          put CRON_SECRET "$CRON_SECRET"

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Smoke test the deployed APIs
        if: steps.secrets.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -u
          sleep 10
          # Parent dashboard: an unknown family must give 401 (D1 bound). 503 means the DB binding is missing.
          code=$(curl -s -o /tmp/parent.json -w '%{http_code}' -X POST "$URL/api/parent" \
            -H 'content-type: application/json' -H 'sec-fetch-site: same-origin' \
            -d '{"familyId":"smoke-test-not-a-real-family-id","pin":"0000"}')
          echo "parent API: HTTP $code $(cat /tmp/parent.json)"
          if [ "$code" = "401" ]; then echo "✔ Parent dashboard storage (D1) is bound"; else echo "::warning::Parent dashboard API returned $code"; fi
          # Premium voice: a short phrase (edge-cached after the first run) must return audio.
          tts=$(curl -s -o /tmp/tts.bin -w '%{http_code} %{content_type}' "$URL/api/tts?v=luna&t=Ready" -H 'sec-fetch-site: same-origin')
          echo "tts API: $tts, $(wc -c < /tmp/tts.bin) bytes"
          case "$tts" in "200 audio/"*) echo "✔ Premium voice (Workers AI) works" ;; *) echo "::warning::Premium voice returned $tts" ;; esac

      - name: Summary
        if: steps.secrets.outputs.ok == 'true'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
