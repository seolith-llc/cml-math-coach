# Email authentication for coach@seolith.com (Amazon SES): custom MAIL FROM subdomain (MX + SPF) and DMARC.
# Dry run by default: reports what exists and what it would create. Tick "apply" to make the changes.
# Never touches the root domain's SPF/MX (Google Workspace), never changes an existing DMARC, stops on any conflict.
# Rules and tests: scripts/email-dns-plan.mjs, tests/email-dns.test.ts.
name: Email DNS

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (create the records and set the SES MAIL FROM). Leave off for a dry run.
        type: boolean
        default: false
      mail_from:
        description: MAIL FROM subdomain
        type: string
        default: bounce.seolith.com
      dmarc_rua:
        description: Optional address for DMARC aggregate reports (only used if no DMARC record exists)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: email-dns
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: ${{ inputs.apply && 'Apply' || 'Dry run' }}
        env:
          APPLY: ${{ inputs.apply && 'true' || 'false' }}
          MAIL_FROM_DOMAIN: ${{ inputs.mail_from }}
          DMARC_RUA: ${{ inputs.dmarc_rua }}
          ZONE_NAME: seolith.com
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node --experimental-transform-types --no-warnings scripts/email-dns.mjs
