# The one scheduled job: every hour, POST /api/hourly. The server decides what is due:
# device practice reminders (each family's chosen local hour), parent nudges (5 pm Chicago, not Sunday)
# and the weekly summary (Sunday evening Chicago, once per week). Safe to run any time.
# Note: GitHub pauses scheduled workflows in public repos after 60 days without repository activity.
name: Hourly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_weekly:
        description: Send this week's summary now (each family still gets at most one per week)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://cml-math-coach.seolith.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::CRON_SECRET secret is not set"; exit 1; fi
          if [ "${{ inputs.force_weekly }}" = "true" ]; then
            path=/api/weekly; body='{"force": true}'
          else
            path=/api/hourly; body='{}'
          fi
          out=$(curl -sS -X POST "$APP_URL$path" -H "authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' -d "$body" -w '\n%{http_code}')
          code=$(echo "$out" | tail -n1); json=$(echo "$out" | sed '$d')
          echo "HTTP $code $json" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then echo "::error::$path returned $code"; exit 1; fi
          if echo "$json" | jq -e '[.. | objects | .error? // empty] | length > 0' >/dev/null; then echo "::warning::$(echo "$json" | jq -c '[.. | objects | .error? // empty]')"; fi
