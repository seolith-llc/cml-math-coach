# Production health report: database state and recent sends (emails masked), then a live probe of the
# dashboard API on the real domain (creates and deletes a throwaway family).
name: Status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/status.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Probe the live site like the app does
        env:
          APP_URL: ${{ vars.APP_URL || 'https://cml-math-coach.seolith.com' }}
        run: node scripts/probe.mjs | tee -a "$GITHUB_STEP_SUMMARY"
