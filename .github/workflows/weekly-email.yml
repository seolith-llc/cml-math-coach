# Sends the weekly progress emails on Sunday evening (US Central).
# GitHub cron is UTC-only, so it runs at both Sunday-evening slots (CDT and CST); the API only sends inside
# the Sunday 5 pm – Monday 6 am America/Chicago window and never twice in the same week.
# Note: GitHub pauses scheduled workflows in public repos after 60 days without repository activity.
name: Weekly progress email

on:
  schedule:
    - cron: '7 23 * * 0' # Sun 23:07 UTC = 6:07 pm CDT / 5:07 pm CST
    - cron: '7 0 * * 1'  # Mon 00:07 UTC = 7:07 pm CDT / 6:07 pm CST
  workflow_dispatch:
    inputs:
      force:
        description: Send now, ignoring the Sunday-evening window (each family still gets at most one per week)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://cml-math-coach.seolith.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FORCE: ${{ inputs.force == true }}
    steps:
      - name: Send in batches
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::CRON_SECRET secret is not set"; exit 1; fi
          total_sent=0
          for i in $(seq 1 20); do
            out=$(curl -sS -X POST "$APP_URL/api/weekly" \
              -H "authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
              -d "{\"force\": $FORCE, \"limit\": 25}" -w '\n%{http_code}')
            code=$(echo "$out" | tail -n1); body=$(echo "$out" | sed '$d')
            echo "batch $i: HTTP $code $body"
            if [ "$code" != "200" ]; then echo "::error::/api/weekly returned $code"; exit 1; fi
            sent=$(echo "$body" | jq -r '.sent'); remaining=$(echo "$body" | jq -r '.remaining')
            failed=$(echo "$body" | jq -r '.failed')
            total_sent=$((total_sent + sent))
            if [ "$failed" != "0" ]; then echo "::warning::$failed email(s) failed: $(echo "$body" | jq -c '.errors')"; fi
            if [ "$(echo "$body" | jq -r '.week')" = "null" ] || [ "$remaining" = "0" ]; then break; fi
          done
          echo "Sent $total_sent weekly email(s)." | tee -a "$GITHUB_STEP_SUMMARY"
